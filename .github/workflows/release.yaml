name: Release image
on:
  push: {tags: ['v*']}
permissions: {contents: read, packages: write, id-token: write, attestations: write}
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: {registry: ghcr.io, username: ${{ github.actor }}, password: ${{ secrets.GITHUB_TOKEN }}}
      - uses: docker/build-push-action@v6
        with: {context: ., file: build/Dockerfile, load: true, platforms: linux/amd64, tags: kmind-agent-docker:scan}
      - uses: aquasecurity/trivy-action@0.30.0
        with: {image-ref: kmind-agent-docker:scan, format: table, exit-code: '1', severity: HIGH,CRITICAL}
      - uses: docker/build-push-action@v6
        with: {context: ., file: build/Dockerfile, push: true, platforms: linux/amd64,linux/arm64, tags: ghcr.io/${{ github.repository }}:${{ github.ref_name }},ghcr.io/${{ github.repository }}:latest, provenance: mode=max, sbom: true}
